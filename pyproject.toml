[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.2.0"
description = "Read-only MCP server for inspecting GitHub repositories: issues, PR diffs, commit history, stale PRs, file churn, code search, and CI status. Runs locally over stdio or as a hosted multi-tenant HTTP service with GitHub OAuth login."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fatima Aleem" }]
keywords = ["mcp", "model-context-protocol", "github", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Pinned to the mcp 1.x series: FastMCP's decorator-based API
# (mcp.server.fastmcp) is what's documented here and what every current
# MCP client (Claude Desktop included) is validated against.
#
# starlette and uvicorn are needed only for hosted (REPOLENS_TRANSPORT=http)
# mode - stdio mode (the default, what Claude Desktop uses) never touches
# them - but they're listed explicitly rather than relied on as mcp's
# transitive deps, since hosted mode depends on their APIs directly
# (custom_route handlers, Request/Response types) and pinning them here
# means a future mcp release can't silently drop or swap them out from
# under this code.
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/fatmah308/repolens"
Repository = "https://github.com/fatmah308/repolens"
Issues = "https://github.com/fatmah308/repolens/issues"

# This is what makes `pipx run repolens` / `repolens` (after `pip install`)
# work, and what an MCP client config's "command" points at.
[project.scripts]
repolens = "repolens.server:main"

# The repo keeps a flat `src/` directory (per project layout convention
# here) rather than the more common `src/repolens/`. This mapping tells
# setuptools to install everything under `src/` as the `repolens` package
# (and `src/tools/` as `repolens.tools`), so internal absolute imports like
# `from repolens.config import ...` and the console-script entry point
# above both resolve correctly - including under `pip install -e .`.
[tool.setuptools]
package-dir = { "repolens" = "src", "repolens.tools" = "src/tools" }
packages = ["repolens", "repolens.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
